<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>概念クイズ</title>
<meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
/* 表示の明るさ: 自動(端末に合わせる) / ライト / ダーク。描画前に適用してちらつきを防ぐ */
(function () {
  var KEY = 'cq-theme', root = document.documentElement, metas = document.querySelectorAll('meta[name="theme-color"]'), orig = [].map.call(metas, function (m) { return m.content; });
  var COLOR = {light: '#f5f5f6', dark: '#0c0c0e'};
  function get() { try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; } }
  function apply(v) {
    if (v === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
    [].forEach.call(metas, function (m, i) { m.content = v === 'auto' ? orig[i] : COLOR[v]; });
  }
  function set(v) { try { if (v === 'auto') localStorage.removeItem(KEY); else localStorage.setItem(KEY, v); } catch (e) {} apply(v); }
  window.cqTheme = {get: get, set: set}; apply(get());
})();
</script>
</head>
<body>
<div id="app"></div>
<nav id="tabbar" class="tabbar" aria-label="画面" hidden>
  <button data-tab="today" aria-current="false">今日</button><button data-tab="find" aria-current="false">探す</button><button data-tab="log" aria-current="false">記録</button>
</nav>
<script src="fsrs.js"></script>
<script src="app.js"></script>
<script src="notes.js"></script>
<script src="cloze.js"></script>
</body>
</html>
